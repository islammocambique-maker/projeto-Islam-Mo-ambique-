<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Digital I.M — Islam Moçambique ®</title>
  <meta name="description" content="Biblioteca Digital do Projeto Islam Moçambique. Portal de estudos islâmicos.">
  <meta name="theme-color" content="#0d4a2c">
  <style>
    :root {
      --verde-escuro: #0d4a2c;
      --dourado: #d4af37;
      --branco: #ffffff;
      --preto: #1a1a1a;
      --vidro-bg: rgba(255, 255, 255, 0.08);
      --vidro-borda: rgba(255, 255, 255, 0.18);
      --vidro-sombra: rgba(0, 0, 0, 0.25);
      --texto: #f5f5f5;
      --texto-suave: #cccccc;
    }

    .tema-claro {
      --verde-escuro: #e8f5e9;
      --dourado: #b8860b;
      --branco: #1a1a1a;
      --preto: #f5f5f5;
      --vidro-bg: rgba(255, 255, 255, 0.45);
      --vidro-borda: rgba(0, 0, 0, 0.08);
      --vidro-sombra: rgba(0, 0, 0, 0.1);
      --texto: #1a1a1a;
      --texto-suave: #444444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--verde-escuro) 0%, #0a2e1b 100%);
      color: var(--texto);
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      padding: 1.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid var(--vidro-borda);
      background: var(--vidro-bg);
      backdrop-filter: blur(12px);
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--dourado);
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      letter-spacing: 1px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--texto-suave);
      margin-top: 0.3rem;
    }

    .btn-tema {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--vidro-bg);
      border: 1px solid var(--vidro-borda);
      color: var(--dourado);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    .btn-tema:hover {
      background: rgba(212, 175, 55, 0.15);
      transform: scale(1.05);
    }

    .nav-topo {
      position: relative;
      z-index: 5;
      max-width: 900px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-voltar {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.5rem;
      background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
      border: 1px solid var(--dourado);
      color: var(--dourado);
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .btn-voltar:hover {
      background: var(--dourado);
      color: var(--preto);
      transform: translateY(-2px);
    }

    .contador-sec {
      color: var(--texto-suave);
      font-size: 0.9rem;
      font-style: italic;
    }

    .biblioteca-container {
      position: relative;
      z-index: 5;
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .biblioteca-container h2 {
      text-align: center;
      color: var(--dourado);
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }

    .biblioteca-container .subtitulo {
      text-align: center;
      color: var(--texto-suave);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .sec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .sec-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.18);
      border-top: 1px solid rgba(255,255,255,0.3);
      border-left: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      color: var(--texto);
      text-decoration: none;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      min-height: 220px;
      justify-content: center;
    }

    .sec-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: left 0.6s;
    }

    .sec-card:hover::before {
      left: 100%;
    }

    .sec-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
      border-color: var(--dourado);
    }

    .sec-card .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 8px rgba(212,175,55,0.3));
    }

    .sec-card h3 {
      color: var(--dourado);
      font-size: 1.1rem;
      margin-bottom: 0.6rem;
      line-height: 1.3;
    }

    .sec-card p {
      color: var(--texto-suave);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .sec-card .tag {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.3rem 0.9rem;
      background: rgba(212,175,55,0.15);
      border: 1px solid var(--dourado);
      color: var(--dourado);
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .vazio {
      text-align: center;
      color: var(--texto-suave);
      padding: 3rem;
      font-style: italic;
    }

    footer {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 3rem;
      border-top: 1px solid var(--vidro-borda);
      background: var(--vidro-bg);
      backdrop-filter: blur(10px);
    }

    .contacto-numero {
      color: var(--dourado);
      font-size: 1.2rem;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .contacto-numero:hover { text-decoration: underline; }

    footer p {
      color: var(--texto-suave);
      font-size: 0.85rem;
    }

    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 55px;
      height: 55px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      transition: transform 0.3s;
      animation: pulse 2s infinite;
    }
    .whatsapp-float:hover { transform: scale(1.1); }
    .whatsapp-float svg { width: 28px; height: 28px; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
      70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .sec-grid { grid-template-columns: 1fr; }
      .sec-card { min-height: 180px; padding: 1.5rem 1rem; }
      .nav-topo { justify-content: center; }
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }
    .reveal.visivel {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <button class="btn-tema" onclick="alternarTema()" title="Alternar tema">🌙/☀️</button>
    <h1>📚 Biblioteca Digital I.M</h1>
    <p>Conhecimento islâmico ao alcance de todos</p>
  </header>

  <div class="nav-topo">
    <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
    <span class="contador-sec" id="contador">Carregando secções...</span>
  </div>

  <main class="biblioteca-container reveal">
    <h2>📖 Secções Disponíveis</h2>
    <p class="subtitulo">Escolha um tema para aprofundar os seus estudos</p>
    <div class="sec-grid" id="sec-grid">
      <div class="vazio">A carregar conteúdo...</div>
    </div>
  </main>

  <footer>
    <a href="https://wa.me/258860407269" class="contacto-numero">📞 +258 86 040 7269</a>
    <p>© 2026 Islam Moçambique ® — Todos os direitos reservados.</p>
  </footer>

  <a href="https://wa.me/258860407269" class="whatsapp-float" title="Fale connosco pelo WhatsApp" target="_blank">
    <svg viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script>
    function alternarTema() {
      document.body.classList.toggle('tema-claro');
      localStorage.setItem('tema', document.body.classList.contains('tema-claro') ? 'claro' : 'escuro');
    }
    if (localStorage.getItem('tema') === 'claro') {
      document.body.classList.add('tema-claro');
    }

    const seccoesFallback = [
      {
        "id": "alcorao",
        "titulo": "ALCORÃO SAGRADO",
        "descricao": "Leitura, tradução e tafsir do Livro Sagrado do Islam.",
        "link": "alcorao/",
        "icon": "📖",
        "tag": "SAGRADO"
      },
      {
        "id": "nawawi",
        "titulo": "ESTUDO DOS 42 AHADITH DE AN NAWAWI",
        "descricao": "As quarenta e duas hadiths fundamentais compiladas pelo imã An-Nawawi.",
        "link": "nawawi/",
        "icon": "🕌",
        "tag": "HADITH"
      },
      {
        "id": "bukhari",
        "titulo": "HADITH SAHIH ALBUKHARI",
        "descricao": "Coleção autêntica de hadiths do imã Muhammad ibn Ismail Al-Bukhari.",
        "link": "bukhari/",
        "icon": "📜",
        "tag": "HADITH"
      },
      {
        "id": "yassarnal",
        "titulo": "YASSARNAL QURAN",
        "descricao": "Método simplificado para aprender a ler o Alcorão em árabe.",
        "link": "yassarnal/",
        "icon": "✍️",
        "tag": "APRENDIZAGEM"
      },
      {
        "id": "tauhid",
        "titulo": "ESTUDO SOBRE TAUHID",
        "descricao": "A unidade de Allah e os fundamentos da fé islâmica.",
        "link": "tauhid/",
        "icon": "☝️",
        "tag": "AQEEDAH"
      },
      {
        "id": "guia",
        "titulo": "ISLAM GUIA",
        "descricao": "Guia prático para novos muçulmanos e quem deseja conhecer o Islam.",
        "link": "guia/",
        "icon": "🧭",
        "tag": "GUIA"
      },
      {
        "id": "sahabas",
        "titulo": "HISTÓRIA DOS SAHABAS",
        "descricao": "As vidas exemplares dos companheiros do Profeta Muhammad ﷺ.",
        "link": "sahabas/",
        "icon": "🌟",
        "tag": "HISTÓRIA"
      }
    ];

    async function carregarSecoes() {
      let seccoes = [];
      try {
        const res = await fetch('data/biblioteca.json');
        if (!res.ok) throw new Error('JSON não encontrado');
        seccoes = await res.json();
      } catch (e) {
        seccoes = seccoesFallback;
      }
      renderizarSecoes(seccoes);
    }

    function renderizarSecoes(seccoes) {
      const grid = document.getElementById('sec-grid');
      const contador = document.getElementById('contador');

      if (!seccoes || seccoes.length === 0) {
        grid.innerHTML = '<div class="vazio">Nenhuma secção disponível de momento.</div>';
        contador.textContent = '0 secções';
        return;
      }

      contador.textContent = `${seccoes.length} secção${seccoes.length > 1 ? 'es' : ''} disponível${seccoes.length > 1 ? 'is' : ''}`;

      grid.innerHTML = seccoes.map(sec => `
        <a href="${sec.link}" class="sec-card">
          <span class="icon">${sec.icon || '📄'}</span>
          <h3>${sec.titulo}</h3>
          <p>${sec.descricao}</p>
          <span class="tag">${sec.tag || 'GERAL'}</span>
        </a>
      `).join('');
    }

    function revelar() {
      const reveals = document.querySelectorAll('.reveal');
      reveals.forEach(el => {
        const top = el.getBoundingClientRect().top;
        const trigger = window.innerHeight - 100;
        if (top < trigger) el.classList.add('visivel');
      });
    }
    window.addEventListener('scroll', revelar);
    window.addEventListener('load', revelar);

    document.addEventListener('DOMContentLoaded', () => {
      carregarSecoes();
      revelar();
    });
  </script>
</body>
</html>
