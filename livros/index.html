<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livros — Loja Virtual I.M</title>
  <meta name="description" content="Livros islâmicos na Loja Virtual do Projeto Islam Moçambique.">
  <style>
    :root {
      --verde-escuro: #0d4a2c;
      --dourado: #d4af37;
      --branco: #ffffff;
      --preto: #1a1a1a;
      --vidro-bg: rgba(255, 255, 255, 0.08);
      --vidro-borda: rgba(255, 255, 255, 0.18);
      --texto: #f5f5f5;
      --texto-suave: #cccccc;
    }

    .tema-claro {
      --verde-escuro: #e8f5e9;
      --dourado: #b8860b;
      --branco: #1a1a1a;
      --preto: #f5f5f5;
      --vidro-bg: rgba(255, 255, 255, 0.45);
      --vidro-borda: rgba(0, 0, 0, 0.08);
      --texto: #1a1a1a;
      --texto-suave: #444444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--verde-escuro) 0%, #0a2e1b 100%);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background 0.4s, color 0.4s;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .btn-tema {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--vidro-bg);
      border: 1px solid var(--vidro-borda);
      color: var(--dourado);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-size: 0.85rem;
      transition: all 0.3s;
      z-index: 10;
    }
    .btn-tema:hover {
      background: rgba(212, 175, 55, 0.15);
      transform: scale(1.05);
    }

    .card-brevemente {
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.2);
      border-top: 1px solid rgba(255,255,255,0.35);
      border-radius: 28px;
      padding: 3.5rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      overflow: hidden;
      animation: entrada 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes entrada {
      from { opacity: 0; transform: scale(0.8) translateY(40px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .card-brevemente::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
      animation: girarGlow 10s linear infinite;
      pointer-events: none;
    }

    @keyframes girarGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .icon-brevemente {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      display: inline-block;
      animation: pulseIcon 2s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(212,175,55,0.3)); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 25px rgba(212,175,55,0.6)); }
    }

    .card-brevemente h1 {
      color: var(--dourado);
      font-size: 1.8rem;
      margin-bottom: 0.6rem;
      position: relative;
      z-index: 1;
    }

    .card-brevemente h2 {
      color: var(--texto);
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }

    .card-brevemente p {
      color: var(--texto-suave);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 1.8rem;
      position: relative;
      z-index: 1;
    }

    .contacto-box {
      background: rgba(212,175,55,0.12);
      border: 1px solid var(--dourado);
      border-radius: 16px;
      padding: 1.2rem;
      margin-bottom: 1.8rem;
      position: relative;
      z-index: 1;
    }

    .contacto-box span {
      display: block;
      color: var(--texto-suave);
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
    }

    .contacto-box a {
      display: block;
      color: var(--dourado);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      margin: 0.3rem 0;
      transition: all 0.3s;
    }
    .contacto-box a:hover {
      color: #f0d878;
      text-decoration: underline;
    }

    .btn-voltar {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 2rem;
      background: linear-gradient(135deg, rgba(212,175,55,0.25), rgba(212,175,55,0.08));
      border: 1.5px solid var(--dourado);
      color: var(--dourado);
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s;
      position: relative;
      z-index: 1;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-voltar:hover {
      background: var(--dourado);
      color: var(--preto);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
    }

    @media (max-width: 480px) {
      .card-brevemente { padding: 2.5rem 1.5rem; }
      .card-brevemente h1 { font-size: 1.5rem; }
      .icon-brevemente { font-size: 4rem; }
    }
  </style>
</head>
<body>

  <button class="btn-tema" onclick="alternarTema()">🌙/☀️</button>

  <div class="card-brevemente">
    <div class="icon-brevemente">📚</div>
    <h1>Abrirá brevemente...</h1>
    <h2>Livros Islâmicos</h2>
    <p>Estamos a preparar esta secção com os melhores livros islâmicos para si. Volte em breve!</p>
    
    <div class="contacto-box">
      <span>📢 Para anunciar o seu produto aqui:</span>
      <a href="mailto:Islammocambique@gmail.com">✉️ Islammocambique@gmail.com</a>
      <a href="https://wa.me/258860404269">📱 +258 86 040 4269</a>
    </div>

    <a href="../loja.html" class="btn-voltar">← Voltar à Loja</a>
  </div>

  <script>
    function alternarTema() {
      document.body.classList.toggle('tema-claro');
      localStorage.setItem('tema', document.body.classList.contains('tema-claro') ? 'claro' : 'escuro');
    }
    if (localStorage.getItem('tema') === 'claro') {
      document.body.classList.add('tema-claro');
    }
  </script>

</body>
</html>
