  .section-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .translation { font-size: 1rem; line-height: 1.8; color: var(--text); margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }

  .btn { flex: 1; padding: 14px 20px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); }
  .btn-secondary { background: var(--surface-light); color: var(--text); }
  .btn-secondary:hover { background: #475569; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
  .counter { text-align: center; margin-top: 16px; font-size: 0.8rem; color: var(--text-muted); }
  .footer { margin-top: 32px; text-align: center; font-size: 0.75rem; color: var(--text-muted); }
  @media (max-width: 600px) { .card { padding: 20px; } .arabic-text { font-size: 1.15rem; } .header h1 { font-size: 1.3rem; } }

    translation: "As ações são julgadas conforme as intenções, e cada pessoa terá o que pretendeu. Quem emigrou para Allah e Seu Mensageiro, sua emigração foi para Allah e Seu Mensageiro; e quem emigrou para obter um benefício mundano ou para casar com uma mulher, sua emigração foi para aquilo que emigrou.",

  },
  {
    arabic: "عَنْ أَبِي عَمْرٍو سُفْيَانَ بْنِ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ! قُلْ لِي فِي الْإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَكَ؛ قَالَ: قُلْ: آمَنْتُ بِاللَّهِ ثُمَّ اسْتَقِمْ",
    translation: "Disse: Ó Mensageiro de Allah, dize-me algo sobre o Islam que eu não pergunte a ninguém além de ti. Ele disse: Dize: Creio em Allah — e depois sê firme (istaqim).",
    tafsir: "Este hadith resume o Islam em duas palavras: fé e firmeza. A fé (iman) é o fundamento, mas sem firmeza (istiqamah) ela se enfraquece. Ser firme significa manter-se constante na obediência a Allah, sem oscilar entre o fervor e a negligência. A consistência é mais valiosa do que os picos ocasionais de devoção."
  },
  {
    arabic: "عَنْ أَبِي عَبْدِ اللَّهِ جَابِرِ بْنِ عَبْدِ اللَّهِ الْأَنْصَارِيِّ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَجُلًا سَأَلَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: أَرَأَيْتَ إِذَا صَلَّيْتُ الْمَكْتُوبَاتِ، وَصُمْتُ رَمَضَانَ، وَأَحْلَلْتُ الْحَلَالَ، وَحَرَّمْتُ الْحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئًا؛ أَأَدْخُلُ الْجَنَّةَ؟ قَالَ: نَعَمْ",
    translation: "Um homem perguntou ao Mensageiro de Allah: Dize-me, se eu realizar as orações obrigatórias, jejuar no Ramadã, considerar lícito o que é halal e proibido o que é haram, e não acrescentar nada a isso, entrarei no Paraíso? Ele respondeu: Sim.",
    tafsir: "Este hadith tranquiliza o crente que cumpre as obrigações básicas do Islam. Não é necessário fazer apenas atividades extraordinárias; a fidelidade às obrigações fundamentais é suficiente para a salvação. O Profeta (S.A.W.) confirma que a entrada no Paraíso está garantida para quem cumpre os pilares e respeita os limites de Allah."
  },
  {
    arabic: "عَنْ أَبِي مَالِكٍ الْحَارِثِ بْنِ عَاصِمٍ الْأَشْعَرِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: الطَّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلَآنِ مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ، كُلُّ النَّاسِ يَغْدُو، فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا",
    translation: "A pureza (taharah) é metade da fé. O 'alhamdulillah' enche a balança. O 'subhanallah' e o 'alhamdulillah' enchem o que está entre o céu e a terra. A oração é luz, a caridade é prova, a paciência é iluminação, e o Alcorão é argumento a teu favor ou contra ti. Todos os seres humanos saem de manhã: um vende sua alma, libertando-a ou arruinando-a.",
    tafsir: "Este hadith magnifico enumera virtudes fundamentais: a pureza ritual e espiritual como base da fé; a dhikr (recordação de Allah) como meio de acumular recompensas; e a oração, caridade, paciência e Alcorão como pilares da vida espiritual. A metáfora final — cada pessoa 'vende' sua alma diariamente — lembra que cada escolha nos aproxima da salvação ou da perdição."
  },
  {
    arabic: "عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، أَنَّهُ قَالَ: يَا عِبَادِي: إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي، وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا؛ فَلَا تَظَالَمُوا. يَا عِبَادِي! كُلُّكُمْ ضَالٌّ إِلَّا مَنْ هَدَيْتُهُ، فَاسْتَهْدُونِي أَهْدِكُمْ...",
    translation: "Ó Meus servos! Eu proibi a opressão para Mim Mesmo, e a tornei proibida entre vós; portanto não vos oprimais uns aos outros. Ó Meus servos! Todos vós estais perdidos exceto aqueles a quem Eu guiei; buscai de Mim a orientação e Eu vos orientarei...",
    tafsir: "Este hadith qudsi (sagrado) contém palavras de Allah transmitidas pelo Profeta. Allah declara Sua justiça absoluta — Ele mesmo nunca oprime. O hadith enfatiza a dependência humana da orientação divina e a misericórdia de Allah em perdoar os pecados. A conclusão poderosa: cada pessoa é responsável por suas ações e será recompensada de acordo."
  },
  {
    arabic: "عَنْ أَبِي ذَرٍّ رَضِيَ اللَّهُ عَنْهُ أَيْضًا، أَنَّ نَاسًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالُوا لِلنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: يَا رَسُولَ اللَّهِ! ذَهَبَ أَهْلُ الدُّثُورِ بِالْأُجُورِ؛ يُصَلُّونَ كَمَا نُصَلِّي، وَيَصُومُونَ كَمَا نَصُومُ، وَيَتَصَدَّقُونَ بِفُضُولِ أَمْوَالِهِمْ. قَالَ: أَوَلَيْسَ قَدْ جَعَلَ اللَّهُ لَكُمْ مَا تَصَّدَّقُونَ؟ إِنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً، وَكُلِّ تَكْبِيرَةٍ صَدَقَةً...",
    translation: "Os ricos levaram as recompensas; eles oram como nós oramos, jejuam como nós jejuamos, e dão caridade com o excesso de suas riquezas. O Profeta respondeu: Acaso Allah não vos deu o que podeis dar em caridade? Com certeza, cada tasbih é caridade, cada takbir é caridade...",
    tafsir: "Este hadith consola os menos abastados, mostrando que a riqueza não é necessária para acumular recompensas. A dhikr (recordação de Allah), o comando do bem, a proibição do mal, e até mesmo o ato conjugal legítimo são formas de caridade. Allah democratizou o acesso às recompensas, tornando-as disponíveis a todos, independentemente da condição financeira."
  },
  {
    arabic: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: كُلُّ سُلَامَى مِنَ النَّاسِ عَلَيْهَا صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ: تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ، وَتُعِينُ الرَّجُلَ فِي دَابَّتِهِ فَتَحْمِلُهُ عَلَيْهَا أَوْ تَرْفَعُ لَهُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَبِكُلِّ خُطْوَةٍ تَمْشِيهَا إِلَى الصَّلَاةِ صَدَقَةٌ، وَتُمِيطُ الْأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ",
    translation: "Cada articulação do corpo humano deve praticar caridade todos os dias em que o sol nasce: julgar justamente entre duas pessoas é caridade. Ajudar um homem com sua montaria, colocando-o sobre ela ou erguendo suas bagagens sobre ela, é caridade. E a palavra boa é caridade. E cada passo que dás em direção à oração é caridade, e remover um objeto prejudicial da estrada é caridade.",
    tafsir: "Este hadith expande radicalmente o conceito de caridade. Não se trata apenas de dinheiro — cada articulação do corpo tem a oportunidade de 'doar' através de ações benéficas. A justiça, a ajuda ao próximo, palavras gentis, caminhar para a oração e limpar o caminho são todas formas de sadaqah. O Islam transforma a vida cotidiana em adoração contínua."
  },
  {
    arabic: "عَنْ النَّوَّاسِ بْنِ سَمْعَانَ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: الْبِرُّ حُسْنُ الْخُلُقِ، وَالْإِثْمُ مَا حَاكَ فِي صَدْرِك، وَكَرِهْتَ أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ",
    translation: "A retidão (birr) está no bom caráter, e o pecado é aquilo que te inquieta no peito e que detestas que as pessoas descubram.",
    tafsir: "Este hadith oferece dois critérios práticos para distinguir o bem do mal: (1) O bem está ligado ao bom caráter — tratar os outros com dignidade e compaixão; (2) O mal é reconhecido pela inquietação interior e pela vergonha de ser descoberto. A consciência (fitrah) é um guia interno que Allah colocou em cada ser humano."
  },
  {
    arabic: "عَنْ أَبِي نَجِيحٍ الْعِرْبَاضِ بْنِ سَارِيَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: وَعَظَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَوْعِظَةً وَجِلَتْ مِنْهَا الْقُلُوبُ، وَذَرَفَتْ مِنْهَا الْعُيُونُ، فَقُلْنَا: يَا رَسُولَ اللَّهِ! كَأَنَّهَا مَوْعِظَةُ مُوَدِّعٍ فَأَوْصِنَا. قَالَ: أُوصِيكُمْ بِتَقْوَى اللَّهِ، وَالسَّمْعِ وَالطَّاعَةِ وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ... وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ؛ فَإِنَّ كُلَّ بِدْعَةٍ ضَلَالَةٌ",
    translation: "O Mensageiro de Allah nos pregou um sermão pelo qual nossos corações ficaram cheios de temor e nossos olhos derramaram lágrimas. Dissemos: Ó Mensageiro de Allah! É como se fosse um sermão de despedida, então aconselha-nos. Ele disse: Aconselho-vos a temer a Allah, a ouvir e obedecer, mesmo que um escravo se torne vosso governante... Acautelai-vos das coisas recém-inventadas, pois toda inovação é desvio.",
    tafsir: "Este é um dos sermões mais importantes do Profeta (S.A.W.), frequentemente chamado de 'sermão de despedida'. Ele enfatiza: (1) A obediência aos governantes legítimos; (2) A adesão estrita à Sunnah e à Sunnah dos Califas Bem-Guiados; (3) A advertência severa contra a bid'ah (inovação religiosa)."
  },
  {
    arabic: "عَنْ مُعَاذِ بْنِ جَبَلٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ! أَخْبِرْنِي بِعَمَلٍ يُدْخِلُنِي الْجَنَّةَ وَيُبَاعِدْنِي مِنَ النَّارِ. قَالَ: لَقَدْ سَأَلْتَ عَنْ عَظِيمٍ، وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللَّهُ عَلَيْهِ: تَعْبُدُ اللَّهَ لَا تُشْرِكْ بِهِ شَيْئًا... أَلَا أُخْبِرُكَ بِرَأْسِ الْأَمْرِ وَعَمُودِهِ وَذُرْوَةِ سَنَامِهِ؟ قُلْتُ: بَلَى. قَالَ: رَأْسُ الْأَمْرِ الْإِسْلَامُ، وَعَمُودُهُ الصَّلَاةُ، وَذُرْوَةُ سَنَامِهِ الْجِهَادُ... فَأَخَذَ بِلِسَانِهِ وَقَالَ: كُفَّ عَلَيْكَ هَذَا",
    translation: "Disse: Ó Mensageiro de Allah, informa-me de uma ação que me leve ao Paraíso e me afaste do Fogo. Ele disse: Perguntaste algo grandioso, mas é fácil para quem Allah facilita: adora Allah sem associar nada a Ele... Queres que te informe da cabeça do assunto, seu pilar e seu pico? Disse: Sim. Ele disse: A cabeça do assunto é o Islam, seu pilar é a oração, e seu pico é o jihad... Então pegou em sua língua e disse: Refreia esta.",
    tafsir: "Este hadith abrangente resume o caminho para a salvação. O Profeta (S.A.W.) estrutura a religião como um edifício: o Islam como fundação, a oração como sustentação, e o jihad como ápice. Ele também destaca meios de aproximação: jejum, caridade e oração noturna. A advertência final sobre a língua é crucial — a maioria dos pecados humanos começa com palavras."
  },
  {
    arabic: "عَنْ أَبِي ثَعْلَبَةَ الْخُشَنِيِّ جُرْثُومِ بْنِ نَاشِرٍ رَضِيَ اللَّهُ عَنْهُ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: إِنَّ اللَّهَ تَعَالَى فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً لَكُمْ غَيْرَ نِسْيَانٍ فَلَا تَبْحَثُوا عَنْهَا",
    translation: "Allah prescreveu obrigações religiosas, portanto não as negligencieis; estabeleceu limites, portanto não os transgredais; proibiu certas coisas, portanto não as violeis; e permaneceu em silêncio sobre outras coisas, por misericórdia para convosco, não por esquecimento — portanto não as busqueis.",
    tafsir: "Este hadith estabelece quatro princípios de conduta: (1) Cumprir as obrigações (fara'id); (2) Respeitar os limites (hudud); (3) Evitar o proibido; (4) Não investigar o que Allah deixou em silêncio. O silêncio de Allah sobre certas questões é uma graça — liberta os crentes de fardos desnecessários."
  },
  {
    arabic: "عَنْ أَبِي الْعَبَّاسِ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: جَاءَ رَجُلٌ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ! دُلَّنِي عَلَى عَمَلٍ إِذَا عَمِلْتُهُ أَحَبَّنِي اللَّهُ وَأَحَبَّنِي النَّاسُ؛ فَقَالَ: ازْهَدْ فِي الدُّنْيَا يُحِبَّكَ اللَّهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّكَ النَّاسُ",
    translation: "Um homem veio ao Profeta e disse: Ó Mensageiro de Allah, indica-me uma ação que, se eu a praticar, Allah me amará e as pessoas me amarão. Ele disse: Desapega-te do mundo e Allah te amará, e desapega-te do que as pessoas possuem e as pessoas te amarão.",
    tafsir: "Este hadith ensina que o amor de Allah e o amor das pessoas estão ligados ao zuhd (desapego) do mundo material. Quem não compete por riquezas nem inveja o que os outros têm, torna-se querido por todos. O desapego não significa abandono completo, mas sim não deixar que os bens mundanos dominem o coração."
  },
  {
    arabic: "عَنْ أَبِي سَعِيدٍ سَعْدِ بْنِ مَالِكِ بْنِ سِنَانٍ الْخُدْرِيِّ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: لَا ضَرَرَ وَلَا ضِرَارَ",
    translation: "Não há dano (darar) nem reciprocidade de dano (dirar).",
    tafsir: "Este hadith conciso estabelece um princípio fundamental de ética no Islam: ninguém pode causar dano a outrem, e ninguém pode retribuir com dano. É uma base para a legislação islâmica em áreas como contratos, vizinhança e direitos individuais."
  },
  {
    arabic: "عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ لَادَّعَى رِجَالٌ أَمْوَالَ قَوْمٍ وَدِمَاءَهُمْ، لَكِنَّ الْبَيِّنَةَ عَلَى الْمُدَّعِي، وَالْيَمِينَ عَلَى مَنْ أَنْكَرَ",
    translation: "Se as pessoas fossem atendidas em suas alegações, alguns homens reivindicariam as riquezas e os sangues de outros. Mas a prova cabe ao reclamante, e o juramento cabe a quem nega.",
    tafsir: "Este hadith estabelece um princípio crucial de justiça: o ônus da prova recai sobre quem acusa, não sobre quem é acusado. Ninguém pode ser condenado sem evidências. O juramento (yamin) é exigido de quem nega a acusação quando não há provas conclusivas."
  },

let current = 0;

function render() {
  const h = hadiths[current];
  document.getElementById('num').textContent = current + 1;
  document.getElementById('arabic').textContent = h.arabic;
  document.getElementById('translation').textContent = h.translation;
  document.getElementById('tafsir').textContent = h.tafsir;

  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === hadiths.length - 1;

  document.getElementById('progress').style.width = ((current + 1) / hadiths.length * 100) + '%';
  document.getElementById('counter').textContent = 'Hadith ' + (current + 1) + ' de ' + hadiths.length;

  const card = document.getElementById('card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeIn 0.4s ease';
}

function next() {
  if (current < hadiths.length - 1) {
    current++;
    render();
  }
}

function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

render();
</script>
